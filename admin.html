<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 PUB - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        header { background: #1a1a1a; color: white; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        h1 { margin-bottom: 5px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: white; cursor: pointer; border-radius: 5px; font-weight: 600; }
        .tab-btn.active { background: #2563eb; color: white; }

        .tab { display: none; background: white; padding: 20px; border-radius: 8px; }
        .tab.active { display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; font-size: 14px; }
        textarea { resize: vertical; min-height: 60px; }

        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }

        .msg { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }

        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .product { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .product-img { width: 100%; height: 220px; background: #e0e0e0; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 10px; color: #999; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
        .product input, .product textarea, .product select { margin-bottom: 8px; }
        .product button { margin-top: 10px; }

        .pagination { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .pagination button { padding: 8px 12px; }
        .pagination button.active { background: #2563eb; }

        .search { margin-bottom: 15px; }
        .search input { width: 100%; padding: 10px; }

        .page-info { text-align: center; color: #666; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 M2 PUB Admin</h1>
            <p>Gérez votre portfolio</p>
        </header>

        <div class="msg" id="msg">✅ Enregistré!</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', this)">Produits</button>
            <button class="tab-btn" onclick="switchTab('about', this)">À Propos</button>
            <button class="tab-btn" onclick="switchTab('services', this)">Services</button>
        </div>

        <!-- PRODUCTS TAB -->
        <div class="tab active" id="products">
            <button class="success" style="margin-bottom: 15px;" onclick="addProduct()">➕ Ajouter un produit</button>

            <div class="search">
                <input type="text" placeholder="🔍 Chercher..." id="search" onkeyup="filterProds()">
            </div>

            <div class="products" id="prods"></div>
            <div class="page-info" id="pageInfo"></div>
            <div class="pagination" id="pag"></div>
        </div>

        <!-- ABOUT TAB -->
        <div class="tab" id="about">
            <div class="form-group">
                <label>Titre</label>
                <input type="text" id="aboutTitle" placeholder="Votre Partenaire en Communication">
            </div>
            <div class="form-group">
                <label>Description 1</label>
                <textarea id="aboutDesc1"></textarea>
            </div>
            <div class="form-group">
                <label>Description 2</label>
                <textarea id="aboutDesc2"></textarea>
            </div>
            <div class="form-group">
                <label>Description 3</label>
                <textarea id="aboutDesc3"></textarea>
            </div>
            <button class="success" onclick="saveAbout()">💾 Enregistrer</button>
        </div>

        <!-- SERVICES TAB -->
        <div class="tab" id="services">
            <div class="form-group">
                <label>Service 1 - Titre</label>
                <input type="text" id="service1Title">
            </div>
            <div class="form-group">
                <label>Service 1 - Description</label>
                <textarea id="service1Desc"></textarea>
            </div>

            <div class="form-group">
                <label>Service 2 - Titre</label>
                <input type="text" id="service2Title">
            </div>
            <div class="form-group">
                <label>Service 2 - Description</label>
                <textarea id="service2Desc"></textarea>
            </div>

            <div class="form-group">
                <label>Service 3 - Titre</label>
                <input type="text" id="service3Title">
            </div>
            <div class="form-group">
                <label>Service 3 - Description</label>
                <textarea id="service3Desc"></textarea>
            </div>

            <div class="form-group">
                <label>Service 4 - Titre</label>
                <input type="text" id="service4Title">
            </div>
            <div class="form-group">
                <label>Service 4 - Description</label>
                <textarea id="service4Desc"></textarea>
            </div>

            <button class="success" onclick="saveServices()">💾 Enregistrer</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://tsqwsiqbhnxlkexkbpzx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_B41-ulTCnWxIATH0nedOkg_tZsMl_qE';

        // ✅ Renamed from `supabase` to `sb` to avoid redeclaring the global `supabase` from the CDN
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let all = [];
        let filtered = [];
        let page = 1;
        const perPage = 6;

        window.addEventListener('load', () => {
            loadPortfolio();
            renderAbout();
            renderServices();
        });

        // ✅ `btn` passed explicitly so we don't rely on the global `event`
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function loadPortfolio() {
            sb.from('portfolio').select('*').then(({ data, error }) => {
                if (error) { console.error(error); return; }
                all = data || [];
                filtered = all;
                render();
            });
        }

        function render() {
            const div = document.getElementById('prods');
            div.innerHTML = '';

            if (filtered.length === 0) {
                div.innerHTML = '<p>Aucun produit</p>';
                document.getElementById('pag').innerHTML = '';
                document.getElementById('pageInfo').innerHTML = '';
                return;
            }

            const start = (page - 1) * perPage;
            const items = filtered.slice(start, start + perPage);
            const usedCats = [...new Set(all.map(i => i.category))];

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'product';
                el.innerHTML = `
                    <div class="product-img" onclick="upload(${item.id})">${item.image_data ? `<img src="${item.image_data}">` : '📷'}</div>
                    <input type="text" value="${item.title ?? ''}" onchange="upd(${item.id}, 'title', this.value)">
                    <select onchange="upd(${item.id}, 'category', this.value)">
                        ${usedCats.map(c => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                    <textarea onchange="upd(${item.id}, 'description', this.value)">${item.description ?? ''}</textarea>
                    <button class="danger" onclick="del(${item.id})">🗑️ Supprimer</button>
                `;
                div.appendChild(el);
            });

            const pages = Math.ceil(filtered.length / perPage);
            const pag = document.getElementById('pag');
            pag.innerHTML = '';
            for (let i = 1; i <= pages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === page ? 'active' : '';
                btn.onclick = () => { page = i; render(); };
                pag.appendChild(btn);
            }

            document.getElementById('pageInfo').textContent = `${start + 1}-${Math.min(start + perPage, filtered.length)} / ${filtered.length}`;
        }

        function addProduct() {
            const usedCats = [...new Set(all.map(i => i.category))];
            const cat = usedCats.length > 0 ? usedCats[0] : 'Design';
            sb.from('portfolio').insert([{ title: 'Nouveau', category: cat, description: 'Description' }]).then(() => {
                loadPortfolio();
                msg();
            });
        }

        function upload(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 600) { h = (h * 600) / w; w = 600; }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        let q = 0.6;
                        let data = canvas.toDataURL('image/jpeg', q);
                        while (data.length > 150 * 1024 && q > 0.3) {
                            q -= 0.05;
                            data = canvas.toDataURL('image/jpeg', q);
                        }
                        sb.from('portfolio').update({ image_data: data }).eq('id', id).then(() => {
                            loadPortfolio();
                            msg();
                        });
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function upd(id, field, val) {
            sb.from('portfolio').update({ [field]: val }).eq('id', id).then(() => {
                loadPortfolio();
                msg();
            });
        }

        function del(id) {
            if (confirm('Supprimer?')) {
                sb.from('portfolio').delete().eq('id', id).then(() => {
                    loadPortfolio();
                    msg();
                });
            }
        }

        function filterProds() {
            const search = document.getElementById('search').value.toLowerCase();
            filtered = all.filter(p =>
                (p.title || '').toLowerCase().includes(search) ||
                (p.description || '').toLowerCase().includes(search)
            );
            page = 1;
            render();
        }

        function renderAbout() {
            sb.from('about').select('*').limit(1).then(({ data, error }) => {
                if (error || !data || data.length === 0) {
                    document.getElementById('aboutTitle').value = 'Votre Partenaire en Communication';
                    document.getElementById('aboutDesc1').value = "Avec 14 ans d'expérience...";
                    document.getElementById('aboutDesc2').value = 'Nous sommes spécialisés...';
                    document.getElementById('aboutDesc3').value = 'Chaque projet...';
                    return;
                }
                const about = data[0];
                document.getElementById('aboutTitle').value = about.title || '';
                document.getElementById('aboutDesc1').value = about.desc1 || '';
                document.getElementById('aboutDesc2').value = about.desc2 || '';
                document.getElementById('aboutDesc3').value = about.desc3 || '';
            });
        }

        function saveAbout() {
            const about = {
                id: 1,
                title: document.getElementById('aboutTitle').value,
                desc1: document.getElementById('aboutDesc1').value,
                desc2: document.getElementById('aboutDesc2').value,
                desc3: document.getElementById('aboutDesc3').value
            };
            sb.from('about').upsert([about]).then(() => msg());
        }

        function renderServices() {
            sb.from('services').select('*').order('service_number', { ascending: true }).then(({ data, error }) => {
                if (error || !data || data.length === 0) {
                    const defaults = [
                        { service_number: 1, title: '🎨 Design Graphique', description: 'Création de designs percutants...' },
                        { service_number: 2, title: '👕 T-shirts Personnalisés', description: 'Impression de vêtements...' },
                        { service_number: 3, title: '📋 Panneaux Publicitaires', description: 'Conception et impression...' },
                        { service_number: 4, title: '📢 Communication Visuelle', description: 'Stratégies visuelles...' }
                    ];
                    defaults.forEach((s, i) => {
                        document.getElementById(`service${i+1}Title`).value = s.title;
                        document.getElementById(`service${i+1}Desc`).value = s.description;
                    });
                    return;
                }
                data.forEach((s, i) => {
                    const idx = s.service_number || (i + 1);
                    const titleEl = document.getElementById(`service${idx}Title`);
                    const descEl = document.getElementById(`service${idx}Desc`);
                    if (titleEl) titleEl.value = s.title || '';
                    if (descEl) descEl.value = s.description || '';
                });
            });
        }

        function saveServices() {
            const services = [
                { service_number: 1, title: document.getElementById('service1Title').value, description: document.getElementById('service1Desc').value },
                { service_number: 2, title: document.getElementById('service2Title').value, description: document.getElementById('service2Desc').value },
                { service_number: 3, title: document.getElementById('service3Title').value, description: document.getElementById('service3Desc').value },
                { service_number: 4, title: document.getElementById('service4Title').value, description: document.getElementById('service4Desc').value }
            ];
            sb.from('services').upsert(services, { onConflict: 'service_number' }).then(() => msg());
        }

        function msg() {
            const el = document.getElementById('msg');
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 1500);
        }
    </script>
</body>
</html>
